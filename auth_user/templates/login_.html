{% extends 'main.html' %}
{% load static %}
{% block abc %}
<link rel="stylesheet" href="{% static 'register.css' %}">
<div class="cont">
   <div class="bigbox">
     <div class="box">
        {% if messages %}
            {% for i in messages %}
                <h2 style="color: blue;">{{i}}</h2>
            {% endfor %}
        {% endif %}
        
         <h2>Login Form</h2>
        <form action="" method="POST">
        {% csrf_token %}

        <div class="fr">
            <label for="">User Name :</label>
            <input type="text" name="un" id="">
        </div>
      
        <div class="fr">
            <label for="">Password :</label>
            <input type="password" name="pswd" id="">
        </div>

        <a href="{% url 'fpaswd' %}">Forgot password ?</a>

        <button type="submit">Login</button>
    </form>

    </div>
   </div>
</div>

{% endblock %}
